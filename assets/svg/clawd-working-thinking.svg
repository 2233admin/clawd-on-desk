<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes body-think{0%,35%,80%{transform:rotate(0deg) translate(0,0)}50%{transform:rotate(1.5deg) translate(.3px,0)}}@keyframes shadow-think{0%,35%,80%{transform:translate(0,0)}50%{transform:translate(.3px,0)}}@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes arm-r-think{0%,38%,75%{transform:rotate(-130deg)}52%{transform:rotate(-138deg)}62%{transform:rotate(-127deg)}}@keyframes arm-l-think{0%,40%,78%{transform:rotate(22deg)}55%{transform:rotate(26deg)}}@keyframes eyes-think{0%,14%,18%,42%,46%,88%{transform:translate(.5px,-.3px) scaleY(1)}16%,44%{transform:translate(.5px,-.3px) scaleY(.1)}56%,70%,74%,78%{transform:translate(-.5px,0) scaleY(1)}76%{transform:translate(-.5px,0) scaleY(.1)}}@keyframes morph-main{0%{transform:translate(0,0)}50%{transform:translate(0,-.3px)}}@keyframes morph-h{0%{transform:translate(0,0)}50%{transform:translate(.3px,0)}}@keyframes morph-v{0%{transform:translate(0,0)}50%{transform:translate(0,.3px)}}@keyframes load-dot-1{0%,20%{opacity:0}21%{opacity:1}}@keyframes load-dot-2{0%,40%{opacity:0}41%{opacity:1}}@keyframes load-dot-3{0%,60%{opacity:0}61%{opacity:1}}.body-master{transform-origin:7.5px 15px;animation:body-think 12s infinite ease-in-out}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.shadow-think{animation:shadow-think 12s infinite ease-in-out}.arm-r{transform-origin:14px 10px;animation:arm-r-think 12s infinite ease-in-out}.arm-l{transform-origin:1px 10px;animation:arm-l-think 12s infinite ease-in-out}.eyes-think{transform-origin:7.5px 8px;animation:eyes-think 12s infinite ease-in-out}.bubble-h{animation:morph-h 5s infinite ease-in-out}.bubble-v{animation:morph-v 4s infinite ease-in-out}.bubble-main{animation:morph-main 6s infinite ease-in-out}.dot{opacity:0}.d1{animation:load-dot-1 2s infinite}.d2{animation:load-dot-2 2s infinite}.d3{animation:load-dot-3 2s infinite}</style></defs><g><g class="think-bubble"><g fill="#FFF" opacity=".9" transform="translate(-3, -7)"><rect width="8" height="7" x="2" y="1" class="bubble-main"/><rect width="10" height="5" x="1" y="2" class="bubble-h"/><rect width="6" height="9" x="3" y="0" class="bubble-v"/><rect width="2" height="2" x="8" y="7"/><rect width="1" height="1" x="10" y="9"/></g><g fill="#0082FC" transform="translate(-3, -7)"><rect width="1" height="1" x="2.5" y="4" class="dot d1"/><rect width="1" height="1" x="5.5" y="4" class="dot d2"/><rect width="1" height="1" x="8.5" y="4" class="dot d3"/></g></g></g><g transform="translate(15, 0) scale(-1, 1)"><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-think" opacity=".5"/><g class="body-master"><g class="breathe"><g fill="#DE886D"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/><rect id="torso" width="11" height="7" x="2" y="6"/><g class="arm-l"><rect width="3" height="2" x="0" y="9"/></g><g class="arm-r"><rect width="2" height="2" x="13" y="9"/></g></g><g fill="#000" class="eyes-think"><rect width="1" height="2" x="5" y="7"/><rect width="1" height="2" x="11" y="7"/></g></g></g></g></svg>